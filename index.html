<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASCII Christmas Tree · 手势圣诞树</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;color:#cfd8dc;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
  canvas{display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(11,13,18,.78);z-index:10;text-align:center;padding:20px}
  #start h1{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:400;letter-spacing:.25em;
    color:#a8e6b4;margin:0;font-size:24px}
  #start p{margin:0;opacity:.7;font-size:14px;line-height:1.8}
  button{font:inherit;padding:10px 28px;border-radius:999px;border:1px solid #a8e6b4;background:transparent;
    color:#a8e6b4;cursor:pointer;font-size:15px}
  button:hover{background:#a8e6b422}
  #guide{position:fixed;right:14px;top:14px;font-size:12px;line-height:1.8;text-align:right;
    font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none}
  #guide div{opacity:.3;transition:opacity .3s,color .3s}
  #guide div.on{opacity:1;color:#ffe08a}
  #status{position:fixed;right:14px;bottom:14px;font-size:12px;opacity:.6;
    font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <h1>ASCII · XMAS · TREE</h1>
  <p>对着摄像头用一只手做手势，让字符长成一棵圣诞树<br>也可以点屏幕一步步切换（电脑可按 0–5）</p>
  <button id="go">开始 ▶</button>
</div>

<div id="guide">
  <div data-s="0">✊ 握拳 · 重置</div>
  <div data-s="1">🖐 张开手掌 · 长出圣诞树</div>
  <div data-s="2">☝️ 竖食指 · 点亮星星</div>
  <div data-s="3">🔄 食指画圈 · 挂上彩灯</div>
  <div data-s="4">✌️ 比耶 · 礼物</div>
  <div data-s="5">🧂 搓手指撒盐 · 驯鹿和雪</div>
</div>
<div id="status">按「开始」启用摄像头</div>
<video id="cam" playsinline muted autoplay style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<script type="module">
/* =====================================================================
   一个很小的「字符 3D 渲染器」：
   3D 点云 → 旋转 / 透视投影 → z-buffer → 光照 → 按亮度选字符 → 画到字符网格
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bloom = document.createElement('canvas');
const bctx = bloom.getContext('2d');
const statusEl = document.getElementById('status');

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const hash2 = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
const easeOutBack = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const code = s => s.charCodeAt(0);

/* ---------------- 相机 ---------------- */
const CAMD = 3.4, CAMY = 0.22, PITCH = 0.1;
const CP = Math.cos(PITCH), SP = Math.sin(PITCH);
const L = (() => { const v = [-0.9, 0.5, -0.3], n = Math.hypot(...v); return v.map(a => a / n); })(); // 左上前方的光
const GROUND = -0.62, TOP = 0.56, STAR_Y = 0.62;

let W, H, DPR, F, CX, CY, cw, chh, cols, rows;
let ZB, CH, CR, CG, CB, TY;          // 字符网格缓冲
function camYZ(y, z) {             // 世界 → 相机（只算 y,z）
  const qy = y - CAMY, qz = z + CAMD;
  return [qy * CP + qz * SP, -qy * SP + qz * CP];
}
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  // 让整棵树（含星星和地面）放进屏幕
  const [yt, zt] = camYZ(STAR_Y + 0.12, 0), [yb, zb] = camYZ(GROUND, -0.55);
  const sTop = yt / zt, sBot = yb / zb, span = sTop - sBot;
  F = Math.min(0.8 * H / span, 1.0 * W * CAMD / 1.02);
  CX = W / 2;
  CY = H * 0.52 + F * (sTop + sBot) / 2;
  chh = Math.max(4.5, F * span / (matchMedia('(pointer: coarse)').matches ? 90 : 96));   // 树大约 96 行字符高
  cw = chh * 0.6;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chh);
  const n = cols * rows;
  ZB = new Float32Array(n); CH = new Uint16Array(n); TY = new Uint8Array(n);
  CR = new Uint8ClampedArray(n); CG = new Uint8ClampedArray(n); CB = new Uint8ClampedArray(n);
  bloom.width = Math.ceil(W / 6); bloom.height = Math.ceil(H / 6);
  initSky();
}

/* ---------------- 几何：点云 ---------------- */
const K_TREE = 0, K_TRUNK = 1, K_ORN = 2, K_GAR = 3, K_GIFT = 4;
const pts = [];   // 先用普通数组收集，再转 typed array
function P(x, y, z, nx, ny, nz, r, g, b, kind, grp = 0, u = 0) { pts.push(x, y, z, nx, ny, nz, r, g, b, kind, grp, u); }

// 树：6 层带下垂枝尖的圆锥
const TIERS = [];
for (let i = 0; i < 6; i++) {
  const f = i / 5;
  const yb = -0.47 + i * 0.165, h = 0.3 - f * 0.1;
  TIERS.push({ yb, yt: i === 5 ? TOP : yb + h, rb: 0.43 * (1 - f * 0.76), rt: i === 5 ? 0 : 0.43 * (1 - f * 0.76) * 0.22, i });
}
function tierR(T, s, phi) {
  const base = T.rt + (T.rb - T.rt) * Math.pow(1 - s, 1.25);
  const tex = 1 + 0.05 * Math.sin(phi * 23 + s * 9 + T.i) * Math.sin(phi * 7 - s * 5 + T.i * 2);
  return base * tex;
}
function tierY(T, s, phi) { return T.yb + s * (T.yt - T.yb) - Math.pow(1 - s, 3) * 0.028 * (1 + Math.sin(phi * 9 + T.i)); }

const SP_ = 0.0055;   // 采样间距
for (const T of TIERS) {
  const h = T.yt - T.yb;
  for (let s = 0; s <= 1; s += SP_ / h * 0.9) {
    const r0 = T.rt + (T.rb - T.rt) * Math.pow(1 - s, 1.25);
    const n = Math.max(6, Math.ceil(2 * Math.PI * r0 / SP_));
    const slope = (T.rb - T.rt) * 1.25 * Math.pow(Math.max(1 - s, 0.001), 0.25) / h;   // -dr/dy
    const off = Math.random() * 6.28;
    for (let k = 0; k < n; k++) {
      const phi = off + k / n * Math.PI * 2;
      const r = tierR(T, s, phi), y = tierY(T, s, phi);
      const nl = Math.hypot(1, slope);
      P(Math.cos(phi) * r, y, Math.sin(phi) * r, Math.cos(phi) / nl, slope / nl, Math.sin(phi) / nl, 0, 0, 0, K_TREE, 0, T.i === 5 ? 0 : clamp((s - 0.5) / 0.5));
    }
  }
}
// 树干
for (let y = GROUND; y < -0.42; y += SP_) for (let k = 0; k < 70; k++) {
  const phi = k / 70 * 6.283;
  P(Math.cos(phi) * 0.065, y, Math.sin(phi) * 0.065, Math.cos(phi), 0, Math.sin(phi), 0, 0, 0, K_TRUNK);
}
// 红色 / 金色挂球
for (const T of TIERS) {
  if (T.i === 5) continue;
  const n = 7 - T.i;
  for (let b = 0; b < n; b++) {
    const s = rand(0.12, 0.45), phi = b / n * 6.283 + rand(-0.3, 0.3);
    const rr = tierR(T, s, phi) + 0.012, cy = tierY(T, s, phi) - 0.012;
    const cx = Math.cos(phi) * rr, cz = Math.sin(phi) * rr, R = 0.021;
    const gold = Math.random() < 0.22;
    const c = gold ? [235, 185, 70] : [205, 32, 48];
    for (let a = 0; a < 18; a++) for (let e = 0; e < 10; e++) {
      const th = a / 18 * 6.283, ph = (e + 0.5) / 10 * Math.PI;
      const nx = Math.sin(ph) * Math.cos(th), ny = Math.cos(ph), nz = Math.sin(ph) * Math.sin(th);
      P(cx + nx * R, cy + ny * R, cz + nz * R, nx, ny, nz, ...c, K_ORN);
    }
  }
}
// 彩灯带：绕在每层下缘的彩虹波浪
for (const T of TIERS) {
  if (T.i === 5) continue;
  for (let band = 0; band < 4; band++) {
    const n = Math.ceil(2 * Math.PI * T.rb / 0.0055);
    for (let k = 0; k < n; k++) {
      const phi = k / n * 6.283;
      const s = 0.1 + 0.07 * Math.sin(phi + T.i * 1.7) + 0.015 * Math.sin(phi * 5);
      const r = tierR(T, s, phi) * 1.03 + 0.008;
      const y = tierY(T, s, phi) + band * 0.006;
      const u = k / n;
      P(Math.cos(phi) * r, y, Math.sin(phi) * r, Math.cos(phi), 0.3, Math.sin(phi), T.i, 0, 0, K_GAR, 0, u);
    }
  }
}
// 礼物盒（第 grp 组，可单独缩放弹出）
const GIFTS = [
  { a: 0.6, r: 0.42, w: 0.17, h: 0.13, d: 0.15, c: [200, 40, 45] },
  { a: 2.1, r: 0.44, w: 0.13, h: 0.17, d: 0.13, c: [40, 110, 210] },
  { a: 3.4, r: 0.42, w: 0.19, h: 0.1, d: 0.16, c: [235, 185, 60] },
  { a: 4.6, r: 0.4, w: 0.12, h: 0.14, d: 0.12, c: [140, 60, 190] },
  { a: 5.6, r: 0.46, w: 0.15, h: 0.11, d: 0.14, c: [45, 160, 90] },
];
GIFTS.forEach((g, gi) => {
  g.cx = Math.cos(g.a) * g.r; g.cz = Math.sin(g.a) * g.r;
  const rot = rand(0, 1.5), ca = Math.cos(rot), sa = Math.sin(rot);
  const put = (lx, ly, lz, nx, ny, nz) => {
    const ribbon = Math.abs(lx) < g.w * 0.09 || Math.abs(lz) < g.d * 0.09;
    const col = ribbon ? [245, 215, 120] : g.c;
    P(g.cx + lx * ca - lz * sa, GROUND + ly, g.cz + lx * sa + lz * ca, nx * ca - nz * sa, ny, nx * sa + nz * ca, ...col, K_GIFT, gi + 1);
  };
  const st = 0.0055;
  for (let x = -g.w / 2; x <= g.w / 2; x += st) for (let z = -g.d / 2; z <= g.d / 2; z += st) put(x, g.h, z, 0, 1, 0);
  for (let x = -g.w / 2; x <= g.w / 2; x += st) for (let y = 0; y <= g.h; y += st) { put(x, y, -g.d / 2, 0, 0, -1); put(x, y, g.d / 2, 0, 0, 1); }
  for (let z = -g.d / 2; z <= g.d / 2; z += st) for (let y = 0; y <= g.h; y += st) { put(-g.w / 2, y, z, -1, 0, 0); put(g.w / 2, y, z, 1, 0, 0); }
  for (let k = 0; k < 120; k++) {                     // 蝴蝶结
    const t = k / 120 * 6.283, side = k % 2 ? 1 : -1;
    const lx = side * (0.02 + 0.018 * Math.cos(t)), ly = g.h + 0.012 + 0.014 * Math.abs(Math.sin(t));
    P(g.cx + lx * ca, GROUND + ly, g.cz + lx * sa, 0, 1, 0, 250, 220, 130, K_GIFT, gi + 1);
  }
});

const STRIDE = 12, NP = pts.length / STRIDE;
const D = new Float32Array(pts); pts.length = 0;
const RND = new Float32Array(NP).map(Math.random);

/* ---------------- 驯鹿：有关节的骨架，会原地踏步 ----------------
   单位：驯鹿高度 = 1，原点在两前后腿中间的地面，朝右 */
function deerShape(t) {
  const ph = t * Math.PI * 2 * 0.9;                     // 步伐节奏
  const bob = 0.014 * Math.sin(ph * 2);                 // 身体上下起伏
  const nod = 0.02 * Math.sin(ph * 2 + 0.8);            // 点头
  const lines = [];
  const ln = (a, b, w = 1) => lines.push([a[0], a[1], b[0], b[1], w]);
  const body = { x0: -0.27, x1: 0.21, y0: 0.42 + bob, y1: 0.6 + bob };
  // 四条腿：[髋关节 x, 相位]，对角腿同步
  for (const [hx, off, front] of [[0.15, 0, 1], [0.08, Math.PI, 1], [-0.17, Math.PI, 0], [-0.24, 0, 0]]) {
    const sw = Math.sin(ph + off);
    const thigh = 0.34 * sw;                            // 前后摆
    const lift = Math.max(0, Math.cos(ph + off));       // 抬腿时弯膝
    const hip = [hx, body.y0 + 0.02];
    const knee = [hip[0] + Math.sin(thigh) * 0.2, hip[1] - Math.cos(thigh) * 0.2];
    const a2 = thigh - (front ? 0.9 : 0.45) * lift;
    const foot = [knee[0] + Math.sin(a2) * 0.21, knee[1] - Math.cos(a2) * 0.21];
    ln(hip, knee); ln(knee, foot);
  }
  // 脖子、头、耳朵
  const head = [0.27, 0.9 + bob + nod];
  ln([0.13, body.y1 - 0.02], head, 2.2);
  ln([head[0] - 0.02, head[1] + 0.02], [head[0] + 0.04, head[1] - 0.02], 2.2);
  ln([head[0], head[1] - 0.01], [head[0] + 0.14, head[1] - 0.05], 1.5);   // 嘴
  ln([head[0] - 0.03, head[1] + 0.03], [head[0] - 0.11, head[1] + 0.07]); // 耳朵
  // 鹿角：两根主枝 + 分叉
  const ab = [head[0] - 0.01, head[1] + 0.04];
  const L1 = [ab[0] - 0.06, ab[1] + 0.22], L2 = [ab[0] + 0.07, ab[1] + 0.22];
  ln(ab, L1); ln(ab, L2);
  ln([ab[0] - 0.03, ab[1] + 0.1], [ab[0] - 0.11, ab[1] + 0.14]);
  ln([ab[0] - 0.05, ab[1] + 0.17], [ab[0] - 0.1, ab[1] + 0.23]);
  ln([ab[0] + 0.035, ab[1] + 0.1], [ab[0] + 0.12, ab[1] + 0.14]);
  ln([ab[0] + 0.055, ab[1] + 0.17], [ab[0] + 0.11, ab[1] + 0.23]);
  // 尾巴（会甩）
  ln([body.x0, body.y1 - 0.02], [body.x0 - 0.07, body.y1 + 0.04 + 0.035 * Math.sin(ph * 3)]);
  return { lines, body };
}
let DMARK = null;

/* ---------------- 天空 / 雪 ---------------- */
let SKY = [];
function initSky() {
  SKY = Array.from({ length: Math.round(cols * rows * 0.006) }, () => ({
    c: Math.random() * cols | 0, r: Math.random() * rows | 0, ph: rand(0, 6.28), sp: rand(0.5, 2),
    ch: code(Math.random() < 0.18 ? '+' : '.')
  }));
}
const SNOW = [];   // 屏幕坐标粒子
function spawnSnow(x, y, vx, vy, life) { SNOW.push({ x, y, vx, vy, life, max: life, ch: code(Math.random() < 0.3 ? '*' : '.') }); }

/* ---------------- 阶段与动画 ---------------- */
const A = { grow: 0, star: 0, light: 0, gift: 0, deer: 0 };
let stage = 0;
function setStage(s) {
  if (s === stage) return;
  if (s >= 5 && stage < 5) burst = 1;
  stage = s;
  document.querySelectorAll('#guide div').forEach(d => d.classList.toggle('on', +d.dataset.s <= s && (s > 0 || +d.dataset.s === 0)));
}
document.querySelector('#guide div').classList.add('on');
let burst = 0;
addEventListener('keydown', e => { if (e.key >= '0' && e.key <= '5') setStage(+e.key); });
cv.addEventListener('click', () => setStage((stage + 1) % 6));

function approach(key, target, upS, downS, dt) {
  const v = A[key];
  A[key] = target > v ? Math.min(target, v + dt / upS) : Math.max(target, v - dt / downS);
}

/* ---------------- 手势 ---------------- */
const video = document.getElementById('cam');
let landmarker = null, hands = [], lastVT = -1, cand = null, candN = 0;
document.getElementById('go').onclick = async () => {
  document.getElementById('start').style.display = 'none';
  statusEl.textContent = '正在加载手势模型…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
    video.srcObject = stream; await video.play();
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const { FilesetResolver, HandLandmarker } = await import(V + '/vision_bundle.mjs');
    const fileset = await FilesetResolver.forVisionTasks(V + '/wasm');
    const make = delegate => HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate },
      runningMode: 'VIDEO', numHands: 2
    });
    try { landmarker = await make('GPU'); } catch (e) { console.warn('GPU 不可用，改用 CPU', e); landmarker = await make('CPU'); }
    statusEl.textContent = '准备好了，举起手吧 🖐';
  } catch (err) {
    console.error(err);
    statusEl.textContent = '摄像头不可用：点屏幕或按 0–5 体验';
  }
};
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fingersUp = lm => [[8, 6], [12, 10], [16, 14], [20, 18]].map(([t, p]) => dist(lm[t], lm[0]) > dist(lm[p], lm[0]) * 1.15);

/* 全部是单手手势（另一只手拿手机）。
   静态：握拳 / 张开 / 竖食指 / 比耶
   动态：食指画圈（看食指尖绕了几圈）、搓手指撒盐（拇指在食指中指尖上来回搓） */
let hist = [], saltActive = false;
function poseOf(h) {
  const size = dist(h[0], h[9]);
  const e = fingersUp(h), n = e.filter(Boolean).length;
  const bunch = dist(h[4], h[8]) < size * 0.42 && dist(h[4], h[12]) < size * 0.55 && dist(h[8], h[0]) > dist(h[5], h[0]) * 1.15;
  if (bunch) return 'bunch';
  if (n === 4) return 'open';
  if (n === 0) return 'fist';
  if (e[0] && e[1] && !e[2] && !e[3]) return 'two';
  if (e[0] && !e[1] && !e[2] && !e[3]) return 'one';
  return null;
}
function record(h, pose, now) {
  const size = dist(h[0], h[9]);
  hist.push({ t: now, pose, size, ix: h[8].x, iy: h[8].y,
    rx: (h[4].x - (h[8].x + h[12].x) / 2) / size, ry: (h[4].y - (h[8].y + h[12].y) / 2) / size,
    wx: h[9].x / size, wy: h[9].y / size });
  while (hist.length && now - hist[0].t > 1600) hist.shift();
}
function circleTurns() {                      // 食指尖绕中心转了几圈
  const H = hist.filter(p => p.pose === 'one');
  if (H.length < 12 || H.length < hist.length * 0.7) return 0;
  let cx = 0, cy = 0; for (const p of H) { cx += p.ix; cy += p.iy; } cx /= H.length; cy /= H.length;
  let rad = 0; for (const p of H) rad += Math.hypot(p.ix - cx, p.iy - cy); rad /= H.length;
  if (rad < H[H.length - 1].size * 0.12) return 0;   // 圈太小 = 只是手抖
  let sum = 0, prev = Math.atan2(H[0].iy - cy, H[0].ix - cx);
  for (const p of H) {
    const a = Math.atan2(p.iy - cy, p.ix - cx); let d = a - prev;
    if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
    sum += d; prev = a;
  }
  return Math.abs(sum) / (2 * Math.PI);
}
function rubAmount() {                        // 拇指相对指尖来回搓的距离 + 手腕抖动
  const H = hist.filter(p => p.pose === 'bunch');
  if (H.length < 10 || H.length < hist.length * 0.6) return 0;
  let path = 0;
  for (let k = 1; k < H.length; k++)
    path += Math.hypot(H[k].rx - H[k - 1].rx, H[k].ry - H[k - 1].ry) + 0.4 * Math.hypot(H[k].wx - H[k - 1].wx, H[k].wy - H[k - 1].wy);
  return path;
}
const G2S = { fist: 0, open: 1, one: 2, circle: 3, two: 4, salt: 5 };
const GNAME = { fist: '握拳', open: '张开手掌', one: '竖食指', circle: '食指画圈', two: '比耶', salt: '搓手指撒盐' };
function fire(g) {
  const next = g === 'fist' ? 0 : Math.max(stage, G2S[g]);
  if (next !== stage) statusEl.textContent = '识别到：' + GNAME[g];
  setStage(next);
}
function handleHands(hs, now) {
  saltActive = false;
  if (!hs.length) { hist = []; cand = null; return; }
  const h = hs[0], pose = poseOf(h);
  record(h, pose, now);
  // 动态手势
  const turns = pose === 'one' ? circleTurns() : 0;
  if (turns > 0.8) { fire('circle'); hist = []; return; }
  if (pose === 'one' && turns > 0.25 && stage >= 2 && stage < 3) statusEl.textContent = `食指画圈… ${Math.min(99, turns / 0.8 * 100 | 0)}%`;
  const rub = pose === 'bunch' ? rubAmount() : 0;
  if (rub > 0.75) { saltActive = true; if (stage < 5) fire('salt'); return; }
  if (pose === 'bunch' && stage >= 4 && stage < 5) statusEl.textContent = `再搓一搓… ${Math.min(99, rub / 0.75 * 100 | 0)}%`;
  // 静态手势：保持几帧才算
  const g = pose === 'bunch' ? null : pose;
  if (g === cand) candN++; else { cand = g; candN = 1; }
  if (g && candN === (g === 'fist' ? 18 : 8)) fire(g);
}

/* ---------------- 渲染工具 ---------------- */
const TREE_RAMP = [...'.:;+=xo*#%&8@'].map(code);
const CAP_RAMP = [...'-=+*#%@'].map(code);
function put(c, r, ch, R, G, B) {
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const i = r * cols + c; CH[i] = ch; CR[i] = R; CG[i] = G; CB[i] = B; ZB[i] = -1;
}
function hsl(h, s, l) {     // → [r,g,b]
  h = ((h % 360) + 360) % 360 / 360;
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return 255 * (t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p); };
  return [f(h + 1 / 3), f(h), f(h - 1 / 3)];
}

/* ---------------- 主循环 ---------------- */
let last = performance.now(), rot = 0, spin = 0.32, handX = null;
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;

  // —— 手势 ——
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    hands = landmarker.detectForVideo(video, now).landmarks || [];
    handleHands(hands, now);
    handX = hands.length === 1 ? 1 - hands[0][9].x : null;
  }
  // 单手左右移动可以拨动树的旋转
  spin += ((handX === null ? 0.32 : 0.32 + (handX - 0.5) * 3) - spin) * 0.05;
  rot += spin * dt;

  // —— 动画进度 ——
  const down = stage === 0;
  approach('grow', stage >= 1 ? 1 : 0, 2.8, 1.6, dt);
  approach('star', stage >= 2 && A.grow > 0.97 ? 1 : 0, 0.9, down ? 0.3 : 0.6, dt);
  approach('light', stage >= 3 && A.grow > 0.97 ? 1 : 0, 1.8, down ? 0.4 : 0.8, dt);
  approach('gift', stage >= 4 && A.grow > 0.97 ? 1 : 0, 1.6, down ? 0.4 : 0.8, dt);
  approach('deer', stage >= 5 && A.grow > 0.97 ? 1 : 0, 2.2, down ? 0.4 : 0.8, dt);

  // —— 清空缓冲 ——
  ZB.fill(1e9); CH.fill(0); TY.fill(0);

  // —— 地面（逐格反投影到 y=GROUND 平面）——
  for (let r = 0; r < rows; r++) {
    const dyc = -((r + 0.5) * chh - CY) / F;
    const dirY = dyc * CP - SP;
    if (dirY >= -1e-4) continue;
    const tHit = (GROUND - CAMY) / dirY, dz = dyc * SP + CP;
    const hz = -CAMD + tHit * dz;
    if (hz > 2.6) continue;
    const stripe = (hz * 9) % 1;
    if (stripe > 0.55) continue;
    const far = clamp(1 - (hz - 0.2) / 2.4);
    for (let c = 0; c < cols; c++) {
      const hx = tHit * ((c + 0.5) * cw - CX) / F;
      const h = hash2(Math.floor(hx * 26), Math.floor(hz * 9));
      if (h < 0.18) continue;
      const rr = hx * hx + hz * hz;
      const b = (0.32 + 0.55 * Math.exp(-rr * 1.2) * (0.35 + 0.65 * A.grow)) * far;
      const i = r * cols + c;
      ZB[i] = tHit; CH[i] = h > 0.86 ? 61 : 45;    // '=' or '-'
      CR[i] = 205 * b; CG[i] = 172 * b; CB[i] = 120 * b;
    }
  }

  // —— 3D 点云 ——
  const cy_ = Math.cos(rot), sy_ = Math.sin(rot);
  const clipY = GROUND + A.grow * (TOP + 0.04 - GROUND);
  const growing = A.grow > 0 && A.grow < 1;
  const gScale = GIFTS.map((g, k) => { const e = clamp(A.gift * 2.2 - k * 0.28); return e > 0 ? easeOutBack(e) : 0; });
  for (let p = 0; p < NP; p++) {
    const o = p * STRIDE, kind = D[o + 9];
    let x = D[o], y = D[o + 1], z = D[o + 2];
    if (kind !== K_GIFT && y > clipY) continue;
    if (kind === K_GAR) {
      const sweep = (1 - (y - GROUND) / (TOP - GROUND)) * 0.55 + D[o + 11] * 0.45;
      if (sweep > A.light * 1.02) continue;
    }
    if (kind === K_GIFT) {
      const s = gScale[D[o + 10] - 1]; if (s <= 0) continue;
      const g = GIFTS[D[o + 10] - 1];
      x = g.cx + (x - g.cx) * s; y = GROUND + (y - GROUND) * s; z = g.cz + (z - g.cz) * s;
    }
    const nx0 = D[o + 3], ny = D[o + 4], nz0 = D[o + 5];
    const xr = x * cy_ + z * sy_, zr = -x * sy_ + z * cy_;
    const nx = nx0 * cy_ + nz0 * sy_, nzr = -nx0 * sy_ + nz0 * cy_;
    const qy = y - CAMY, qz = zr + CAMD;
    const yc = qy * CP + qz * SP, zc = -qy * SP + qz * CP;
    const nyc = ny * CP + nzr * SP, nzc = -ny * SP + nzr * CP;
    if (nzc > 0.3) continue;                       // 背面剔除
    const sx = CX + xr * F / zc, sy = CY - yc * F / zc;
    const c = sx / cw | 0, r = sy / chh | 0;
    if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
    const i = r * cols + c;
    if (zc >= ZB[i]) continue;
    ZB[i] = zc;
    let lum = Math.max(0, nx * L[0] + nyc * L[1] + nzc * L[2]);
    let R, G, B, ch;
    if (kind === K_TREE) {
      lum = clamp((0.06 + 0.94 * lum) * (0.8 + 0.4 * RND[p]) * (1 - 0.55 * D[o + 11]) + Math.max(0, nyc) * 0.1);
      if (lum < 0.5) { const k = lum * 2; R = 12 + 38 * k; G = 50 + 95 * k; B = 32 + 45 * k; }
      else { const k = (lum - 0.5) * 2; R = 50 + 125 * k; G = 145 + 95 * k; B = 77 + 108 * k; }
      ch = TREE_RAMP[Math.min(12, (0.22 + 0.78 * lum) * 13 | 0)];
      TY[i] = 1;
      if (growing && clipY - y < 0.05) {            // 生长边缘的白紫色高光
        const k = (1 - (clipY - y) / 0.05) * 0.75;
        R += (225 - R) * k; G += (215 - G) * k; B += (255 - B) * k;
      }
    } else if (kind === K_TRUNK) {
      lum = 0.2 + 0.8 * lum; R = 120 * lum; G = 78 * lum; B = 45 * lum; ch = TREE_RAMP[(4 + lum * 8) | 0];
    } else if (kind === K_ORN) {
      const spec = Math.pow(lum, 14) * 190, l2 = 0.3 + 0.85 * lum;
      R = D[o + 6] * l2 + spec; G = D[o + 7] * l2 + spec; B = D[o + 8] * l2 + spec; ch = code(lum > 0.6 ? '@' : 'o');
    } else if (kind === K_GAR) {
      const tw = 0.7 + 0.3 * Math.sin(t * 5 + RND[p] * 30);
      const [r1, g1, b1] = hsl(D[o + 11] * 360 * 1.3 + D[o + 6] * 55 - t * 45, 0.95, 0.6);
      R = r1 * tw; G = g1 * tw; B = b1 * tw; ch = code(RND[p] > 0.5 ? '@' : '#');
    } else {
      const l2 = 0.28 + 0.85 * lum; R = D[o + 6] * l2; G = D[o + 7] * l2; B = D[o + 8] * l2;
      ch = TREE_RAMP[Math.min(12, (0.35 + 0.65 * lum) * 13 | 0)];
    }
    CH[i] = ch; CR[i] = R; CG[i] = G; CB[i] = B;
  }

  // —— 补洞：被树包围的空格子用邻居填上，避免竖条纹 ——
  for (let r = 1; r < rows - 1; r++) for (let c = 1; c < cols - 1; c++) {
    const i = r * cols + c; if (TY[i]) continue;
    const a = TY[i - 1] && TY[i + 1] ? i - 1 : TY[i - cols] && TY[i + cols] ? i - cols : -1;
    if (a < 0) continue;
    CH[i] = CH[a]; CR[i] = CR[a] * 0.9; CG[i] = CG[a] * 0.9; CB[i] = CB[a] * 0.9; ZB[i] = ZB[a]; TY[i] = 2;
  }

  // —— 生长切面：一圈发光的白紫色圆盘 ——
  if (growing) {
    for (const T of TIERS) {
      if (clipY < T.yb - 0.03 || clipY > T.yt) continue;
      const s = clamp((clipY - T.yb) / (T.yt - T.yb));
      const R0 = T.rt + (T.rb - T.rt) * Math.pow(1 - s, 1.25);
      for (let rr = 0; rr <= R0; rr += 0.007) {
        const n = Math.max(1, Math.ceil(6.283 * rr / 0.006)), q = rr / Math.max(R0, 1e-3);
        for (let k = 0; k < n; k++) {
          const phi = k / n * 6.283;
          const x = Math.cos(phi) * rr, z = Math.sin(phi) * rr;
          const xr = x * cy_ + z * sy_, zr = -x * sy_ + z * cy_;
          const [yc, zc] = camYZ(clipY, zr);
          const c = (CX + xr * F / zc) / cw | 0, r = (CY - yc * F / zc) / chh | 0;
          if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
          const i = r * cols + c;
          if (zc >= ZB[i]) continue;
          ZB[i] = zc;
          const band = 0.5 + 0.5 * Math.sin(q * 16 - t * 6);
          const b = 0.55 + 0.45 * q;
          CR[i] = (150 + 100 * band) * b; CG[i] = (125 + 120 * band) * b; CB[i] = 255 * b;
          CH[i] = CAP_RAMP[Math.min(6, (q * 0.6 + band * 0.4) * 7 | 0)];
        }
      }
    }
    if (A.grow < 0.95 && stage >= 1 && Math.random() < 0.7) {     // 生长时往上飘的光点
      const a = rand(0, 6.28), rr = rand(0, 0.45);
      const [yc, zc] = camYZ(clipY, Math.sin(a) * rr);
      spawnSnow(CX + Math.cos(a) * rr * F / zc, CY - yc * F / zc, rand(-8, 8), rand(-60, -20), rand(0.8, 1.6));
    }
  }

  // —— 雪 ——
  if (burst > 0) {                                     // 比心时爆开一圈雪
    const [ty, tz] = camYZ(0.05, 0);
    for (let k = 0; k < 450; k++) {
      const a = rand(0, 6.28), sp = rand(40, 260);
      spawnSnow(CX + rand(-0.3, 0.3) * F / tz, CY - ty * F / tz + rand(-0.4, 0.4) * F / tz,
        Math.cos(a) * sp, Math.sin(a) * sp - 60, rand(2.5, 6));
    }
    burst = 0;
  }
  if (saltActive && A.grow > 0.9) {                   // 搓手指的时候，从树顶撒下一把雪
    const [ty, tz] = camYZ(STAR_Y + 0.1, 0);
    for (let k = 0; k < 6; k++) spawnSnow(CX + rand(-0.35, 0.35) * F / tz, CY - ty * F / tz + rand(-20, 20), rand(-20, 20), rand(20, 90), rand(3, 6));
  }
  if (stage >= 5 && A.deer > 0.9 && Math.random() < 0.5) spawnSnow(rand(0, W), -5, rand(-10, 10), rand(25, 60), rand(8, 14));
  for (let k = SNOW.length - 1; k >= 0; k--) {
    const s = SNOW[k];
    s.life -= dt; if (s.life <= 0 || s.y > H + 10) { SNOW.splice(k, 1); continue; }
    s.vx *= 0.985; s.vy = s.vy * 0.985 + 22 * dt;
    s.x += (s.vx + Math.sin(t * 2 + k) * 6) * dt; s.y += s.vy * dt;
    const a = clamp(s.life / s.max * 1.5) * 235;
    put(s.x / cw | 0, s.y / chh | 0, s.ch, a, a, a + 15);
  }

  // —— 星星 ——
  let starPos = null;
  if (A.star > 0) {
    const [yc, zc] = camYZ(STAR_Y, 0);
    const c0 = Math.round(CX / cw), r0 = Math.round((CY - yc * F / zc) / chh);
    starPos = [c0 * cw + cw / 2, r0 * chh + chh / 2];
    const s = easeOutBack(clamp(A.star)), pulse = 0.88 + 0.12 * Math.sin(t * 3.2);
    const gold = (k) => [255 * k, 222 * k, 150 * k];
    const Lh = Math.round(15 * s * pulse), Lv = Math.round(10 * s * pulse);
    for (let k = 2; k <= Lh; k++) { const f = 1 - k / (Lh + 1); put(c0 - k, r0, code(k > Lh * 0.75 ? '.' : '-'), ...gold(f)); put(c0 + k, r0, code(k > Lh * 0.75 ? '.' : '-'), ...gold(f)); }
    for (let k = 1; k <= Lv; k++) { const f = 1 - k / (Lv + 1); put(c0, r0 - k, code(k > Lv * 0.8 ? ':' : '|'), ...gold(f)); }
    for (let k = 1; k <= Math.round(5 * s); k++) put(c0, r0 + k, code('|'), ...gold(0.6 - k * 0.1));
    if (s > 0.3) {
      for (let k = 1; k <= 3; k++) {
        const f = 0.9 - k * 0.15;
        put(c0 - 1 - k, r0 - 1, code('\\'), ...gold(f)); put(c0 + 1 + k, r0 - 1, code('/'), ...gold(f));
        put(c0 - 1 - k, r0 + 1, code('/'), ...gold(f)); put(c0 + 1 + k, r0 + 1, code('\\'), ...gold(f));
      }
      put(c0 - 4, r0 - 2, code(':'), ...gold(0.5)); put(c0 + 4, r0 - 2, code(':'), ...gold(0.5));
      put(c0 - 4, r0 + 2, code(':'), ...gold(0.5)); put(c0 + 4, r0 + 2, code(':'), ...gold(0.5));
    }
    for (let k = -1; k <= 1; k++) { put(c0 + k, r0 - 1, code('#'), 255, 215, 120); put(c0 + k, r0 + 1, code('#'), 255, 215, 120); }
    for (let k = -2; k <= 2; k++) put(c0 + k, r0, code(Math.abs(k) === 2 ? '#' : '@'), 255, 240, 190);
    for (let k = 0; k < 10; k++) {                    // 星星周围一闪一闪的 +
      const tw = Math.sin(t * 2.5 + k * 1.9);
      if (tw > 0.3) put(c0 + Math.round(Math.cos(k * 2.4) * (6 + k % 4 * 2)), r0 + Math.round(Math.sin(k * 2.4) * (3 + k % 3)), code(tw > 0.8 ? '+' : '.'), 230 * tw, 230 * tw, 240 * tw);
    }
  }

  // —— 驯鹿：和树一样的点状字符，身体是毛衣花纹，原地踏步 ——
  if (A.deer > 0) {
    if (!DMARK || DMARK.length !== cols * rows) DMARK = new Uint8Array(cols * rows);
    DMARK.fill(0);
    const [ay, az] = camYZ(-0.47, -0.5);
    const Hd = 0.37 * F / az, ax = CX + 0.03 * F / az, ayS = CY - ay * F / az;
    const { lines, body } = deerShape(t);
    const list = [];
    const mark = (c, r, type) => {
      if (c < 0 || r < 0 || c >= cols || r >= rows) return;
      const i = r * cols + c; if (DMARK[i]) return;
      DMARK[i] = type; list.push(i);
    };
    // 线条：按像素采样，每个采样点盖住约 2 列 × 1 行
    for (const [x1, y1, x2, y2, w] of lines) {
      const X1 = ax + x1 * Hd, Y1 = ayS - y1 * Hd, X2 = ax + x2 * Hd, Y2 = ayS - y2 * Hd;
      const len = Math.hypot(X2 - X1, Y2 - Y1), n = Math.ceil(len / (cw * 0.4));
      const tw = cw * 0.55 * w, th = chh * 0.35 * w;
      for (let k = 0; k <= n; k++) {
        const x = X1 + (X2 - X1) * k / n, y = Y1 + (Y2 - Y1) * k / n;
        for (let c = Math.floor((x - tw) / cw); c <= Math.floor((x + tw) / cw); c++)
          for (let r = Math.floor((y - th) / chh); r <= Math.floor((y + th) / chh); r++) mark(c, r, 1);
      }
    }
    // 身体：白色轮廓 + 里面一行行 x+ 花纹
    const c0 = Math.round((ax + body.x0 * Hd) / cw), c1 = Math.round((ax + body.x1 * Hd) / cw);
    const r0 = Math.round((ayS - body.y1 * Hd) / chh), r1 = Math.round((ayS - body.y0 * Hd) / chh);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const edgeR = r === r0 || r === r1, edgeC = c === c0 || c === c1;
      if (edgeR && edgeC) continue;                       // 圆角
      if (edgeR || edgeC) mark(c, r, 1);
      else if ((r - r0) % 2 === 0) mark(c, r, 2);         // 花纹行
      else mark(c, r, 3);                                 // 花纹行之间留暗
    }
    // 外圈一格压暗，让驯鹿从树上「抠」出来
    for (const i of list) {
      const c = i % cols, r = i / cols | 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const j = (r + dr) * cols + c + dc;
        if (j < 0 || j >= CH.length || DMARK[j] || !CH[j]) continue;
        const k = 1 - 0.85 * clamp(A.deer * 1.5);
        CR[j] *= k; CG[j] *= k; CB[j] *= k;
      }
    }
    // 画出来：从下往上闪烁着出现
    const span = Math.max(1, r1 - r0 + 40);
    for (const i of list) {
      const c = i % cols, r = i / cols | 0;
      const h = hash2(c, r);
      const fromBottom = clamp((ayS / chh - r) / (Hd * 1.45 / chh));
      if (fromBottom > A.deer * 1.25 - h * 0.25) continue;
      const tw = 0.82 + 0.18 * Math.sin(t * 5 + h * 40);
      const type = DMARK[i];
      if (type === 3) { CH[i] = 0; CR[i] = CG[i] = CB[i] = 0; ZB[i] = -1; continue; }
      const ch = type === 1 ? code(h < 0.45 ? 'o' : h < 0.8 ? '@' : '8') : code(c % 3 === 1 ? '+' : 'x');
      const b = type === 1 ? 255 : 215;
      put(c, r, ch, b * tw, b * tw, (b - 10) * tw);
    }
  }

  // —— 背景星空（只填空格子）——
  for (const s of SKY) {
    const i = s.r * cols + s.c; if (CH[i]) continue;
    const b = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    CH[i] = s.ch; CR[i] = 210 * b; CG[i] = 215 * b; CB[i] = 235 * b;
  }

  // —— 画字符网格 ——
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);
  ctx.font = `bold ${Math.round(chh * 1.02)}px ui-monospace,Menlo,Consolas,"Courier New",monospace`;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  let lastStyle = -1;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c, ch = CH[i]; if (!ch) continue;
    const key = (CR[i] >> 3) << 10 | (CG[i] >> 3) << 5 | (CB[i] >> 3);
    if (key !== lastStyle) { ctx.fillStyle = `rgb(${CR[i]},${CG[i]},${CB[i]})`; lastStyle = key; }
    ctx.fillText(String.fromCharCode(ch), c * cw, r * chh);
  }

  // —— 柔光：缩小再放大叠加 ——
  bctx.clearRect(0, 0, bloom.width, bloom.height);
  bctx.drawImage(cv, 0, 0, bloom.width, bloom.height);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.32; ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bloom, 0, 0, W, H);
  if (starPos) {
    const R = chh * 14 * A.star * (0.9 + 0.1 * Math.sin(t * 3.2));
    const g = ctx.createRadialGradient(...starPos, 0, ...starPos, R);
    g.addColorStop(0, 'rgba(255,215,130,.45)'); g.addColorStop(1, 'rgba(255,215,130,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(starPos[0] - R, starPos[1] - R, 2 * R, 2 * R);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  drawCam();
  requestAnimationFrame(frame);
}

function drawCam() {
  if (!video.videoWidth) return;
  const pw = Math.min(220, W * 0.32), ph = pw * video.videoHeight / video.videoWidth, x0 = 14, y0 = 14;
  ctx.save();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x0, y0, pw, ph, 12) : ctx.rect(x0, y0, pw, ph); ctx.clip();
  ctx.globalAlpha = 0.9; ctx.translate(x0 + pw, y0); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, pw, ph);
  ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.2;
  for (const lm of hands) {
    const pt = i => [x0 + (1 - lm[i].x) * pw, y0 + lm[i].y * ph];
    ctx.beginPath(); for (const [a, b] of BONES) { ctx.moveTo(...pt(a)); ctx.lineTo(...pt(b)); } ctx.stroke();
    for (let i = 0; i < 21; i++) { const [x, y] = pt(i); ctx.beginPath(); ctx.arc(x, y, 2, 0, 6.28); ctx.fill(); }
  }
  ctx.restore();
}

addEventListener('resize', resize); resize();
requestAnimationFrame(frame);
</script>
</body>
